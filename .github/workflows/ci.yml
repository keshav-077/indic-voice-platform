name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Test environment — no external services
  VAI_JWT_SECRET: "test_secret_at_least_32_characters_long"
  VAI_API_KEY_SALT: "test_salt_16chars"
  STATIC_API_KEYS: "test-api-key-12345"
  WARMUP_MODELS: "false"
  CONSENT_REQUIRED: "false"
  VAI_ASR_BACKEND: "bhashini"
  VAI_MT_BACKEND: "bhashini"
  VAI_TTS_BACKEND: "bhashini"
  VAI_DB_URL: ""
  VAI_REDIS_URL: "redis://localhost:6379/15"

jobs:
  # Lint & Type Check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy api/ services/ core/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # non-blocking for now; tighten as codebase matures

  # Unit Tests
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (no heavy models)
        run: |
          pip install -e ".[dev]"
          # Install audio deps for test fixtures
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # Integration Tests
  test-integration:
    name: Integration Tests (BHASHINI mock)
    runs-on: ubuntu-latest
    needs: test-unit

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: true  # integration tests may fail in CI without real credentials

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          load: true
          tags: bharatvoiceai:ci-${{ github.sha }}

      - name: Smoke test container
        run: |
          docker run -d \
            --name vai-test \
            -p 8000:8000 \
            -e VAI_JWT_SECRET="test_secret_at_least_32_characters_long" \
            -e VAI_API_KEY_SALT="test_salt_16chars" \
            -e STATIC_API_KEYS="test-api-key-12345" \
            -e WARMUP_MODELS="false" \
            -e VAI_DB_URL="" \
            bharatvoiceai:ci-${{ github.sha }}
          
          sleep 10
          curl -f http://localhost:8000/health/live || (docker logs vai-test && exit 1)
          docker stop vai-test

  # Publish Docker Image (on main branch push)
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [test-unit, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/duttasam/bharatvoiceai:latest
            ghcr.io/duttasam/bharatvoiceai:${{ github.sha }}
