---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bharatvoiceai-hpa
  namespace: vai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bharatvoiceai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Scale down slowly to avoid thrashing

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: bharatvoiceai-service
  namespace: vai
  annotations:
    prometheus.io/scrape: "true"
spec:
  selector: {app: bharatvoiceai}
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vai-ingress
  namespace: vai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"       # audio uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"    # long inference
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # WebSocket support for /v1/asr/stream
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts: [api.your-domain.com]
      secretName: vai-tls-cert
  rules:
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bharatvoiceai-service
                port: {number: 80}

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vai-sa
  namespace: vai

---
# PodDisruptionBudget (keep at least 1 pod during node drain)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bharatvoiceai-pdb
  namespace: vai
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: bharatvoiceai}

---
# NetworkPolicy (restrict traffic to only what's needed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bharatvoiceai-netpol
  namespace: vai
spec:
  podSelector:
    matchLabels: {app: bharatvoiceai}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8000}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8000}]      # Prometheus scrape
  egress:
    - {}                          # Allow all outbound (BHASHINI, Sarvam APIs, etc.)
