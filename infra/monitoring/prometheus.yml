# Prometheus scrape configuration for BharatVoiceAI
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: bharatvoiceai
    environment: local

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager endpoint here

scrape_configs:
  - job_name: "bharatvoiceai"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
