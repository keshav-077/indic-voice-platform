<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9933;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb366;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#138808;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000080;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="chakra" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000080;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000080;stop-opacity:0.3"/>
    </radialGradient>
    <filter id="vbGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tricolor background stripes -->
  <rect x="0" y="60" width="400" height="80" fill="url(#saffron)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="140" width="400" height="80" fill="#ffffff" opacity="0.5"/>
  <rect x="0" y="220" width="400" height="80" fill="url(#green)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>
  
  <!-- Central Ashoka Chakra inspired design -->
  <g transform="translate(200, 200)" filter="url(#vbGlow)">
    <!-- Outer ring -->
    <circle r="100" fill="none" stroke="url(#blue)" stroke-width="3">
      <animate attributeName="r" values="100;103;100" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Middle ring -->
    <circle r="80" fill="none" stroke="url(#blue)" stroke-width="2" opacity="0.6"/>
    
    <!-- Rotating spokes (24 spokes like Ashoka Chakra) -->
    <g stroke="url(#blue)" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
      <line x1="0" y1="-75" x2="0" y2="-90"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(15)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(30)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(45)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(60)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(75)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(90)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(105)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(120)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(135)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(150)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(165)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(180)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(195)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(210)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(225)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(240)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(255)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(270)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(285)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(300)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(315)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(330)"/>
      <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(345)"/>
    </g>
    
    <!-- Central hub with audio waves -->
    <circle r="25" fill="url(#chakra)"/>
    
    <!-- Microphone icon in center -->
    <g transform="scale(0.6)">
      <rect x="-12" y="-25" width="24" height="35" rx="12" fill="url(#saffron)">
        <animate attributeName="height" values="35;38;35" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <path d="M -3 12 L -3 25 M 3 12 L 3 25 M -10 25 L 10 25" 
            stroke="url(#green)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Animated language text orbiting -->
    <g>
      <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
            fill="url(#saffron)" text-anchor="middle">
        <animateTransform attributeName="transform" type="rotate" 
                          values="0 0 0;360 0 0" dur="12s" repeatCount="indefinite"/>
        <tspan x="0" y="-115">हि</tspan>
      </text>
    </g>
    <g>
      <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
            fill="url(#green)" text-anchor="middle">
        <animateTransform attributeName="transform" type="rotate" 
                          values="90 0 0;450 0 0" dur="12s" repeatCount="indefinite"/>
        <tspan x="0" y="-115">த</tspan>
      </text>
    </g>
    <g>
      <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
            fill="url(#blue)" text-anchor="middle">
        <animateTransform attributeName="transform" type="rotate" 
                          values="180 0 0;540 0 0" dur="12s" repeatCount="indefinite"/>
        <tspan x="0" y="-115">বা</tspan>
      </text>
    </g>
    <g>
      <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
            fill="url(#saffron)" text-anchor="middle">
        <animateTransform attributeName="transform" type="rotate" 
                          values="270 0 0;630 0 0" dur="12s" repeatCount="indefinite"/>
        <tspan x="0" y="-115">తె</tspan>
      </text>
    </g>
  </g>
  
  <!-- Corner decorative elements -->
  <circle cx="50" cy="100" r="5" fill="url(#saffron)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="100" r="5" fill="url(#green)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="50" cy="300" r="5" fill="url(#blue)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="350" cy="300" r="5" fill="url(#saffron)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Text -->
  <text x="200" y="325" font-family="Arial, sans-serif" font-size="40" font-weight="bold" 
        text-anchor="middle">
    <tspan fill="url(#saffron)">Voice</tspan><tspan fill="url(#blue)">Bharat</tspan> <tspan fill="url(#green)">Pro</tspan>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="16" 
        fill="#666" text-anchor="middle" opacity="0.8">
    22 Indian Languages • Enterprise AI
  </text>
</svg>
