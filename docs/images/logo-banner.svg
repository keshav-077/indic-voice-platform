<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="VoiceBharat Pro logo">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f2efe7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" fill="url(#paper)"/>
  <g transform="translate(72,36)">
    <rect x="0" y="0" width="148" height="148" rx="24" fill="#171a22" opacity="0.06"/>
    <rect x="8" y="8" width="132" height="132" rx="20" fill="#171a22"/>
    <g transform="translate(8,8)">

    <circle cx="66" cy="66" r="20" fill="none" stroke="#e8913a" stroke-width="3" opacity="0.9">
      <animate attributeName="r" values="18;46;18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="66" cy="66" r="28" fill="none" stroke="#138808" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="22;50;22" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

      <text x="66" y="92" text-anchor="middle" fill="#fbfaf6" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="500" font-style="italic">V</text>
      <circle cx="116" cy="28" r="8" fill="#e8913a">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <text x="260" y="98" fill="#171a22" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="500" font-style="italic" letter-spacing="-0.02em">VoiceBharat Pro</text>
  <text x="262" y="132" fill="#71766f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.18em">ENTERPRISE VOICE AI FOR 22 INDIAN LANGUAGES</text>
  <rect x="260" y="148" width="0" height="3" rx="1.5" fill="#e8913a">
    <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="178" fill="#454a44" font-family="system-ui, -apple-system, sans-serif" font-size="15">ASR · MT · TTS · LID · NLU on one platform.</text>
</svg>
